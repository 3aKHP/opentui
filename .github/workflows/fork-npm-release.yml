# Fork-infra (never upstreamed): Option B release pipeline. Publishes the
# scoped fork packages from a protected tag using npm Trusted Publishing
# (OIDC). Bind this workflow on npmjs.com per package (repo 3aKHP/opentui,
# workflow fork-npm-release.yml) — until every package is bound, local token
# publishing via scripts/fork/publish-scoped.ts remains the fallback (D3b).
name: Fork npm release

on:
  push:
    tags:
      # Fork release tags only; anchored so stray refs cannot start a
      # publish pipeline (the first step below is the second layer).
      - "v[0-9]*.[0-9]*.[0-9]*-zv*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write

    steps:
      # Refuse non-release refs before any toolchain or build step can run;
      # malformed tags fail here in seconds instead of after a full native
      # build. Together with the trigger glob above and the scripts'
      # onReleaseContext() guard this is the outermost of three layers.
      - name: Validate release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*-zv[0-9]*) ;;
            *) echo "::error::refusing to run the release pipeline for '$GITHUB_REF'"; exit 1 ;;
          esac

      # Full history + tags: prepare-scoped-release.ts verifies the upstream
      # base tag (e.g. v0.5.9) exists before transforming dist, and counts the
      # patch commits from it. The default single-ref checkout has no tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # npm ≥ 11.5.1 is required for Trusted Publishing and provenance; the
      # runner's bundled npm is older.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Derive release version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ZIG_LOCAL_CACHE_DIR must stay at step level: the runner context is
      # unavailable in job env, and referencing it there invalidates the
      # whole workflow — every run then fails with zero jobs (issue #4).
      - name: Stage fork platform packages
        run: bun scripts/fork/stage-platform-packages.ts "${{ steps.version.outputs.version }}"
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-cache

      - name: Prepare core package
        run: |
          cd packages/solid && bun run build
          cd ../..
          bun scripts/fork/prepare-solid-release.ts "${{ steps.version.outputs.version }}"
          bun scripts/fork/prepare-scoped-release.ts "${{ steps.version.outputs.version }}"
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-cache

      - name: Publish (platforms first, main last — D3c)
        run: |
          bun scripts/fork/publish-scoped.ts
          bun scripts/fork/publish-scoped.ts --dir=packages/solid/dist
        env:
          NPM_CONFIG_PROVENANCE: "true"
